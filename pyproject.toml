[project]
name = "pm-productivity"
version = "0.1.0"
description = "PM productivity toolkit, Flow experiments, and agent scripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "markdown>=3.10.3",
    "mcp>=1.0.0",
    "msal>=1.28.0",
    "openai>=1.40.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.14.2",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "xhtml2pdf>=0.2.18",
]

[tool.uv]
managed = true
