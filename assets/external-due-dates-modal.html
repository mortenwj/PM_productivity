<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>External due dates — mock</title>
  <style>
    :root {
      --border: #d0d4d8;
      --header-muted: #5c6368;
      --table-bg: #eef0f2;
      --row-hover: #e3f2fd;
      --primary: #1976d2;
      --danger: #c62828;
      --radius: 8px;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      color: #333;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #9aa0a6;
      padding: 24px;
    }

    .backdrop {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      width: min(920px, 100%);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--header-muted);
    }

    .header-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      color: var(--header-muted);
      font-size: 16px;
      line-height: 1;
    }

    .icon-btn:hover {
      background: #f0f2f4;
    }

    .modal-body {
      padding: 12px 18px 18px;
      flex: 1;
      overflow: auto;
    }

    .hint {
      color: var(--danger);
      font-size: 12px;
      margin: 0 0 10px;
    }

    .table-wrap {
      background: var(--table-bg);
      border-radius: var(--radius);
      padding: 10px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    th,
    td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #e8eaec;
    }

    th {
      font-weight: 600;
      color: #444;
      font-size: 12px;
      background: #fafbfc;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr {
      cursor: pointer;
    }

    tbody tr:hover {
      background: var(--row-hover);
    }

    .col-check {
      width: 40px;
      text-align: center;
    }

    .col-doc a {
      color: var(--primary);
      text-decoration: none;
    }

    .col-doc a:hover {
      text-decoration: underline;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 18px;
      border-top: 1px solid var(--border);
    }

    .btn {
      min-width: 88px;
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    .btn-secondary {
      background: #fff;
      border: 1px solid var(--border);
      color: #333;
    }

    .btn-secondary:hover {
      background: #f5f6f7;
    }

    .btn-primary {
      background: var(--primary);
      border: 1px solid var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      filter: brightness(1.05);
    }
  </style>
</head>
<body>
  <div class="backdrop" role="dialog" aria-labelledby="dlg-title">
    <header class="modal-header">
      <h1 id="dlg-title" class="modal-title">External due dates</h1>
      <div class="header-actions">
        <button type="button" class="icon-btn" aria-label="Help">?</button>
        <button type="button" class="icon-btn" aria-label="Resize">⤢</button>
        <button type="button" class="icon-btn" aria-label="Close">×</button>
      </div>
    </header>

    <div class="modal-body">
      <p class="hint">Select the External due dates to sign off.</p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-check" scope="col"></th>
              <th scope="col">Title</th>
              <th scope="col">Connected document</th>
              <th scope="col">Stage</th>
              <th scope="col">Deadline</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="col-check"><input type="checkbox" aria-label="Select row 1" /></td>
              <td>Deadline for info</td>
              <td class="col-doc"><a href="#">PAF_info_request.pdf</a></td>
              <td>Customer sign-off</td>
              <td>4/22/2026 12:00:00 AM</td>
              <td>Scheduled</td>
            </tr>
            <tr>
              <td class="col-check"><input type="checkbox" aria-label="Select row 2" /></td>
              <td>Deadline for info</td>
              <td class="col-doc"><a href="#">Annex_2_responses.docx</a></td>
              <td>Internal review</td>
              <td>4/22/2026 12:00:00 AM</td>
              <td>Scheduled</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <footer class="modal-footer">
      <button type="button" class="btn btn-secondary">Close</button>
      <button type="button" class="btn btn-primary">OK</button>
    </footer>
  </div>
</body>
</html>
